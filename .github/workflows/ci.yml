name: CI

on:
  pull_request:
  workflow_call:

# Tests never need to write to the repo, even when release.yml calls this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; a release's test run never is.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test

  # Parallel jobs: each installs only its own browser and gets the runner's
  # workers to itself. WebKit is about twice as slow, so it's split in two.
  e2e:
    name: End-to-end (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: webkit 1/2, browser: webkit, projects: --project=webkit, shard: 1/2 }
          - { name: webkit 2/2, browser: webkit, projects: --project=webkit, shard: 2/2 }
          - { name: chromium, browser: chromium, projects: --project=chromium, shard: 1/1 }
          # Phones and tablets: touch emulation in both engines.
          - { name: touch, browser: webkit chromium, projects: --project=mobile-webkit --project=mobile-chromium --project=tablet-webkit, shard: 1/1 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Azure mirror can stall Playwright's system dependency downloads.
      - name: Use HTTPS Ubuntu mirrors
        run: sudo sed -i '\|http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
      - name: Install browsers
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}
      # Starts the prod build, the Worker on a fresh local D1/R2, the desktop
      # flavour of the build and the link-preview fixtures (see playwright.config.ts).
      - run: |
          if [ "${{ matrix.name }}" = "chromium" ]; then
            xvfb-run --auto-servernum pnpm test:e2e ${{ matrix.projects }} --shard=${{ matrix.shard }}
          else
            pnpm test:e2e ${{ matrix.projects }} --shard=${{ matrix.shard }}
          fi
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  perf:
    name: Perf budget (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared runners are noisy; this reports numbers but never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use HTTPS Ubuntu mirrors
        run: sudo sed -i '\|http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run perf spec
        working-directory: apps/web
        run: |
          PERF=1 pnpm exec playwright test --project=chromium --grep @perf --reporter=line | tee perf.log
          echo '### Perf (1,000 cards / 300 images)' >> "$GITHUB_STEP_SUMMARY"
          grep '^PERF' perf.log | sed 's/^PERF /```json\n/; s/$/\n```/' >> "$GITHUB_STEP_SUMMARY" || true
