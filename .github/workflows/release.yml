name: Release

# Every merge to main: test, stage compatible Mac artifacts, then deploy
# the Worker + web app and publish the release. APP_VERSION selects its updater.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Secrets go only to the steps that use them (never job-wide), so dependency
# installs, build scripts and third-party actions can't read them. Actions are
# pinned to commit SHAs.

env:
  PUBLIC_URL: https://notepad.dog

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 0.<minor from version.json>.<release run number>
      - id: v
        run: |
          echo "version=0.$(jq -r .minor version.json).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "notes=$(git log -1 --pretty=%s | tr -d '\r' | head -c 300)" >> "$GITHUB_OUTPUT"

  # The compatible bundle and its versioned manifest exist before MIN_CLIENT
  # changes. Deploying APP_VERSION exposes that already-staged updater atomically.
  deploy:
    name: Deploy Worker + web app
    needs: [ci, version, desktop]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: VITE_APP_VERSION=$VERSION pnpm --filter web build
      - name: Migrate database
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply doggynote --remote
      - name: Deploy
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --var APP_VERSION:$VERSION

  desktop:
    name: Build + stage Mac app
    needs: [version, ci]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14 # Apple silicon
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NOTES: ${{ needs.version.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Stamp version
        working-directory: apps/desktop/src-tauri
        run: jq --arg v "$VERSION" '.version = $v' tauri.conf.json > t.json && mv t.json tauri.conf.json

      - name: Build app
        working-directory: apps/desktop
        run: VITE_API_BASE=$PUBLIC_URL VITE_APP_VERSION=$VERSION pnpm exec tauri build --bundles app

      # Imported after the build, so the unlocked signing identity is never
      # exposed to build scripts.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(openssl rand -base64 18)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"
          # codesign only resolves identities in keychains on the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Sign by fingerprint: the cert is self-signed (untrusted), so lookups by name can miss it.
          ID=$(security find-identity -p codesigning "$KC" | awk '/DoggyNote Signing/ {print $2; exit}')
          test -n "$ID" || { security find-identity -p codesigning "$KC"; exit 1; }
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Sign + package
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: OUT=release sh scripts/release-desktop.sh

      - name: Stage versioned files in R2 (manifest last)
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          R=../desktop/release
          put() { pnpm exec wrangler r2 object put "doggynote-assets/desktop/$1" --file "$2" --content-type "$3" --remote; }
          put "$VERSION/DoggyNote.app.tar.gz" "$R/$VERSION/DoggyNote.app.tar.gz" application/gzip
          put "$VERSION/DoggyNote_${VERSION}_aarch64.dmg" "$R/$VERSION/DoggyNote_${VERSION}_aarch64.dmg" application/x-apple-diskimage
          put "$VERSION/latest.json" "$R/latest.json" application/json

      - name: Retain manifest and disk image for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-${{ env.VERSION }}
          path: |
            apps/desktop/release/latest.json
            apps/desktop/release/${{ env.VERSION }}/DoggyNote_${{ env.VERSION }}_aarch64.dmg
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: Publish updater and GitHub release
    needs: [version, desktop, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NOTES: ${{ needs.version.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-release-${{ env.VERSION }}
          path: apps/desktop/release
      - name: Publish fallback manifest
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler r2 object put doggynote-assets/desktop/latest.json --file ../desktop/release/latest.json --content-type application/json --remote
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" "apps/desktop/release/$VERSION/DoggyNote_${VERSION}_aarch64.dmg" --title "DoggyNote $VERSION" --notes "$NOTES"
