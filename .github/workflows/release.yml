name: Notarization status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Read Apple's submission status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json > "$RUNNER_TEMP/history.json"
          cat "$RUNNER_TEMP/history.json"
          ID=$(jq -r '.history[0].id // empty' "$RUNNER_TEMP/history.json")
          if [ -n "$ID" ]; then
            xcrun notarytool info "$ID" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json
          fi
